<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="{{csp}}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWT Preview</title>
  <style nonce="{{nonce}}">{{styles}}</style>
</head>
<body>
  <h2>JWT Preview</h2>

  <textarea id="input" placeholder="Paste a JWT token" aria-label="Paste a JWT token" spellcheck="false">{{initialToken}}</textarea>
  <div class="toolbar">
    <button id="paste" class="secondary">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3" width="9" height="11" rx="1.2"></rect><path d="M6 3a1.5 1.5 0 0 1 1.5-1.5h1A1.5 1.5 0 0 1 10 3"></path><path d="M6 7.2h4M6 9.6h4M6 12h2.5"></path></svg>
      Paste &amp; decode
    </button>
    <button id="clear" class="secondary">Clear</button>
  </div>

  <div id="error" class="error-box hidden" role="alert"></div>

  <div id="result" class="hidden plain-mode">
    <div class="viewbar">
      <span>JSON</span>
      <label class="switch">
        <input type="checkbox" id="viewmode" role="switch" aria-label="Simple view" checked>
        <span class="track"></span>
      </label>
      <span>Simple</span>
    </div>
    <div class="section header">
      <h3>Header
        <button class="mini" data-target="header" data-open="true">Expand all</button>
        <button class="mini" data-target="header" data-open="false">Collapse all</button>
      </h3>
      <div class="jsonwrap view-json">
        <button class="copybtn" data-copy="header" title="Copy JSON" aria-label="Copy header JSON">
          <svg class="ic-copy" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.5" y="5.5" width="8" height="8" rx="1"></rect><path d="M10.5 3.5v-1a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h1"></path></svg>
          <svg class="ic-check" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5l3.5 3.5L13 5"></path></svg>
        </button>
        <div class="jsonbox" id="header"></div>
      </div>
      <div class="jsonbox view-plain" id="header-plain"></div>
    </div>
    <div class="section payload">
      <h3>Payload
        <button class="mini" data-target="payload" data-open="true">Expand all</button>
        <button class="mini" data-target="payload" data-open="false">Collapse all</button>
      </h3>
      <div class="jsonwrap view-json">
        <button class="copybtn" data-copy="payload" title="Copy JSON" aria-label="Copy payload JSON">
          <svg class="ic-copy" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.5" y="5.5" width="8" height="8" rx="1"></rect><path d="M10.5 3.5v-1a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h1"></path></svg>
          <svg class="ic-check" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5l3.5 3.5L13 5"></path></svg>
        </button>
        <div class="jsonbox" id="payload"></div>
      </div>
      <div class="jsonbox view-plain" id="payload-plain"></div>
      <div class="claims" id="claims"></div>
    </div>
    <div class="section sig">
      <h3>Signature</h3>
      <pre id="signature"></pre>
    </div>
  </div>

  <script nonce="{{nonce}}">{{script}}</script>
</body>
</html>
